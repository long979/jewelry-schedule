<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小爱珠宝阁 · 拍摄行程</title>
<style>
  :root { --rose:#c98a6d; --rose-d:#b0705a; --gold:#d8a85c; --bg:#fff4ee; --card:#ffffff; --ink:#5a4a42; --soft:#a08f85; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); padding-bottom:88px; }
  /* ===== 封面区 ===== */
  .hero { position:relative; overflow:hidden; padding:34px 20px 52px; text-align:center; color:#fff;
    background:linear-gradient(160deg,#e8b4a0 0%,#d89a86 38%,#c98f5f 100%); }
  .hero .spark { position:absolute; font-size:20px; opacity:.5; animation:tw 3s ease-in-out infinite; }
  .hero .s1 { top:18px; left:18px; } .hero .s2 { top:30px; right:26px; animation-delay:1s; }
  .hero .s3 { bottom:20px; left:40%; animation-delay:2s; }
  @keyframes tw { 0%,100%{opacity:.2;} 50%{opacity:.8;} }
  .hero img.cover { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .hero .hero-in { position:relative; z-index:1; }
  .hero .orn { font-size:14px; letter-spacing:10px; opacity:.95; }
  .hero h1 { font-size:24px; font-weight:700; letter-spacing:5px; margin-top:8px; text-shadow:0 2px 10px rgba(0,0,0,.15); }
  .hero .sub { font-size:11px; opacity:.92; margin-top:8px; letter-spacing:3px; }
  .hero .hero-line { width:70px; height:2px; margin:14px auto 0; background:rgba(255,255,255,.7); border-radius:2px; }
  /* ===== 今日 + 倒计时 ===== */
  .today { background:var(--card); border-radius:16px; margin:-24px 16px 6px; padding:13px 16px; position:relative; z-index:2;
    box-shadow:0 8px 20px rgba(184,112,84,.18); }
  .today .row { display:flex; justify-content:space-between; align-items:center; }
  .today .lbl { font-size:11px; color:var(--rose); }
  .today .main { font-size:16px; font-weight:700; margin-top:2px; }
  .today .date { font-size:12px; color:var(--soft); }
  .countdown { margin:0 16px 6px; font-size:12px; color:var(--rose-d); text-align:center; background:#fdeee4; border-radius:12px; padding:8px 10px; }
  .countdown b { color:var(--rose-d); }
  /* ===== 标签栏 ===== */
  .tabs { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #f4e4db; display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:10; }
  .tab { flex:1; text-align:center; padding:9px 0 8px; font-size:11px; color:var(--soft); background:none; border:none; cursor:pointer; }
  .tab .ico { font-size:18px; display:block; margin-bottom:3px; }
  .tab.active { color:var(--rose-d); font-weight:700; }
  .tab.active::before { content:""; position:absolute; top:0; left:35%; right:35%; height:3px; background:linear-gradient(90deg,var(--rose),var(--gold)); border-radius:0 0 3px 3px; }
  .panel { display:none; padding:16px; } .panel.active { display:block; }
  .stitle { font-size:14px; font-weight:700; color:var(--rose-d); margin:6px 4px 14px; }
  .card { background:var(--card); border-radius:18px; padding:15px; margin-bottom:12px; box-shadow:0 4px 14px rgba(184,112,84,.12); }
  .card.today-mark { border:2px solid var(--gold); box-shadow:0 6px 20px rgba(216,168,92,.25); }
  .card.done-card { opacity:.55; }
  .chip { display:inline-block; font-size:11px; color:#fff; background:linear-gradient(90deg,var(--rose),var(--gold)); border-radius:20px; padding:3px 12px; }
  .chip.today { background:linear-gradient(90deg,#e08a3c,#d8a85c); font-weight:700; }
  .shead { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .shead .t { font-size:15px; font-weight:700; flex:1; }
  .btn-done { border:1px solid var(--rose); color:var(--rose); background:none; font-size:11px; padding:4px 12px; border-radius:20px; cursor:pointer; white-space:nowrap; }
  .btn-done.finished { background:var(--rose); color:#fff; border-color:var(--rose); }
  .stime { font-size:12px; color:var(--rose); margin-top:6px; }
  .sd { font-size:12px; color:var(--soft); margin-top:8px; line-height:1.7; }
  .prep { margin-top:12px; background:#fff9f5; border-radius:12px; padding:10px 12px; }
  .prep .p-title { font-size:12px; font-weight:700; color:var(--rose-d); margin-bottom:7px; }
  .prep-item { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink); padding:4px 0; cursor:pointer; }
  .prep-item input { width:18px; height:18px; accent-color:var(--rose); flex-shrink:0; }
  .prep-item.checked { color:var(--soft); text-decoration:line-through; }
  .progress { font-size:11px; color:var(--soft); margin-top:6px; }
  .th { display:flex; align-items:center; gap:12px; }
  .th .ic { width:46px; height:46px; border-radius:50%; background:linear-gradient(135deg,#f6d9c9,#f0e2b6); display:flex; align-items:center; justify-content:center; font-size:21px; flex-shrink:0; }
  .th .name { font-size:15px; font-weight:700; }
  .th .meta { font-size:11px; color:var(--soft); margin-top:4px; }
  .scrip { background:#fff9f5; border-radius:12px; padding:11px 13px; margin-top:11px; }
  .scrip .st { font-size:12px; font-weight:700; color:var(--rose-d); margin-bottom:5px; }
  .scrip li { font-size:12px; color:var(--soft); line-height:1.9; margin-left:16px; }
  .btn-nav { display:inline-block; margin-top:10px; margin-right:8px; font-size:12px; color:#fff; background:linear-gradient(90deg,#e08a3c,#c9a050); border-radius:20px; padding:6px 14px; text-decoration:none; }
  .btn-tel { display:inline-block; margin-top:10px; font-size:12px; color:var(--rose-d); background:#fdeee4; border-radius:20px; padding:6px 14px; text-decoration:none; }
  .empty { text-align:center; color:#d0bfb4; font-size:12px; margin:30px 0; }
</style>
</head>

// ===== 工具 =====
function keyDone(item){ return "v3done-" + item.date + "-" + item.title; }
function keyPrep(item, i){ return "v3prep-" + item.date + "-" + item.title + "-" + i; }
function isDone(item){ return localStorage.getItem(keyDone(item)) === "1"; }
function setDone(item, v){ localStorage.setItem(keyDone(item), v ? "1" : "0"); }
function isPrep(item, i){ return localStorage.getItem(keyPrep(item, i)) === "1"; }
function setPrep(item, i, v){ localStorage.setItem(keyPrep(item, i), v ? "1" : "0"); }
function parseDate(str){ var m = str.match(/(\d{1,2})月(\d{1,2})日/); if(!m) return null; return new Date(new Date().getFullYear(), parseInt(m[1])-1, parseInt(m[2])); }
function todayStr(){ var n = new Date(); return (n.getMonth()+1) + "月" + n.getDate() + "日"; }
function daysBetween(a, b){ return Math.round((b - a) / 86400000); }

  var md = todayStr();
  document.getElementById("todayDate").textContent = md + " " + ["周日","周一","周二","周三","周四","周五","周六"][now.getDay()];
  var hit = DATA.schedule.find(function(s){ return s.date === md; });
  document.getElementById("todayMain").textContent = hit ? hit.title : "今日暂无安排";

  var all = DATA.schedule.concat(DATA.pickup.map(function(p){ return {date:p.date,title:"拿货："+p.from}; }));
  var next = all.filter(function(x){ var d = parseDate(x.date); return d && d > now; })
    .sort(function(a,b){ return parseDate(a.date) - parseDate(b.date); })[0];
  var cd = document.getElementById("countdown");
  if (next) {
    var n = daysBetween(now, parseDate(next.date));
    cd.innerHTML = n === 0 ? "⏰ <b>今天</b> · " + next.title : "⏰ 距 <b>" + next.date + "</b> " + next.title + " 还有 <b>" + n + " 天</b>";
  } else {
    cd.innerHTML = "本月暂无更多安排";
  }
}

// ===== 行程 =====
function rD() {
  var el = document.getElementById('scheduleList');
  if (!DATA.schedule.length) { el.innerHTML = '<div class="empty">暂无安排</div>'; return; }
  el.innerHTML = DATA.schedule.map(function(s, idx){
    var isT = s.date === todayStr();
    var done = isDone(s);
    var checked = s.prep ? s.prep.filter(function(_, i){ return isPrep(s, i); }).length : 0;
    var total = s.prep ? s.prep.length : 0;
    var prepHtml = s.prep ? '<div class="prep"><div class="p-title">📋 准备清单</div>' +
      s.prep.map(function(p, i){
        var c = isPrep(s, i);
        return '<label class="prep-item' + (c ? ' checked' : '') + '"><input type="checkbox"' + (c ? ' checked' : '') + ' onchange="togglePrep(' + idx + ',' + i + ')">' + p + '</label>';
      }).join('') +
      '<div class="progress">已完成 ' + checked + ' / ' + total + '</div></div>' : '';
    return '<div class="card' + (isT ? ' today-mark' : '') + (done ? ' done-card' : '') + '">' +
      '<div class="shead">' +
        '<span class="chip' + (isT ? ' today' : '') + '">' + s.date + ' ' + s.day + '</span>' +
        '<span class="stime">' + s.time + '</span>' +
      '</div>' +
      '<div style="margin-top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">' +
        '<div style="flex:1;"><div class="t" style="font-size:15px;font-weight:700;">' + s.title + '</div>' +
        '<div class="sd">' + s.detail + '</div></div>' +
        '<button class="btn-done' + (done ? ' finished' : '') + '" onclick="toggleDone(' + idx + ')">' + (done ? '✓ 已完成' : '标记完成') + '</button>' +
      '</div>' + prepHtml + '</div>';
  }).join('');
}
function toggleDone(idx){
  var s = DATA.schedule[idx];
  setDone(s, !isDone(s));
  rD();
}
function togglePrep(idx, i){
  var s = DATA.schedule[idx];
  setPrep(s, i, !isPrep(s, i));
  rD();
}

// ===== 主题 =====
function rT() {
  var el = document.getElementById('themeList');
  if (!DATA.themes.length) { el.innerHTML = '<div class="empty">暂无主题</div>'; return; }
  el.innerHTML = DATA.themes.map(function(t){
    return '<div class="card"><div class="th"><div class="ic">' + t.icon + '</div>' +
      '<div style="flex:1"><div class="name">' + t.name + '</div><div class="meta">' + t.items.join(' · ') + '</div></div>' +
      '<span class="chip">' + t.tag + '</span></div></div>';
  }).join('');
}

// ===== 脚本 =====
function rS() {
  var el = document.getElementById('scriptList');
  if (!DATA.scripts.length) { el.innerHTML = '<div class="empty">暂无脚本</div>'; return; }
  el.innerHTML = DATA.scripts.map(function(sc){
    return '<div class="card"><div class="t" style="font-size:15px;font-weight:700;">' + sc.theme + '</div>' +
      sc.scenes.map(function(x){
        var html = '<div class="scrip"><div class="st">' + x.title + '</div>';
        if (x.shot) { html += '<div style="font-size:11px;color:#e08a3c;margin:4px 0;background:#fdeee4;border-radius:6px;padding:5px 8px;">🎥 画面：' + x.shot + '</div>'; }
        html += '<div style="font-size:12px;font-weight:700;color:var(--rose-d);margin-bottom:4px;">🎙️ 主播</div>';
        html += x.talk.map(function(t){ return '<li>' + t + '</li>'; }).join('');
        return html + '</div>';
      }).join('') + '</div>';
  }).join('');
}

// ===== 拿货 =====
function rP() {
  var el = document.getElementById('pickupList');
  if (!DATA.pickup.length) { el.innerHTML = '<div class="empty">暂无拿货安排</div>'; return; }
  el.innerHTML = DATA.pickup.map(function(p){
    var nav = '<a class="btn-nav" href="https://uri.amap.com/search?keyword=' + encodeURIComponent(p.from) + '" target="_blank">🧭 导航去</a>';
    var tel = p.phone ? '<a class="btn-tel" href="tel:' + p.phone + '">📞 ' + p.phone + '</a>' : '';
    return '<div class="card"><div class="shead"><span class="chip">' + p.date + ' 拿货</span></div>' +
      '<div style="margin-top:10px;"><div class="t" style="font-size:15px;font-weight:700;">' + p.from + '</div>' +
      '<div class="sd">货品：' + p.items + '</div>' +
      '<div class="sd" style="color:var(--rose-d);">备注：' + p.note + '</div>' +
      '<div>' + nav + tel + '</div></div></div>';
  }).join('');
}

// ===== 装扮 =====
function rY() {
  var el = document.getElementById('styleList');
  if (!DATA.style || !DATA.style.length) { el.innerHTML = '<div class="empty">暂无装扮参考</div>'; return; }
  el.innerHTML = DATA.style.map(function(s){
    return '<div class="card"><div class="th"><div class="ic">' + s.icon + '</div>' +
      '<div style="flex:1"><div class="name">' + s.day + '</div></div></div>' +
      '<div style="margin-top:10px;">' + s.items.map(function(it){
        return '<div style="font-size:12px;color:var(--soft);line-height:1.8;padding:2px 0;display:flex;gap:6px;"><span style="color:var(--rose-d);">·</span><span>' + it + '</span></div>';
      }).join('') + '</div></div>';
  }).join('');
}

// ===== Tab =====
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('active'); });
    document.querySelectorAll('.panel').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    document.getElementById('p-' + b.dataset.tab).classList.add('active');
  });
});

rD(); rT(); rS(); rP(); rY(); renderToday();
</script>
</body>
</html>
